{% extends 'gestion/base.html' %}
{% load static %}

{% block titulo %}Inventaria - Crear cuenta{% endblock %}

{% block contenido %}
<main class="pagina-auth">
    <div class="tarjeta-auth">
        <div class="marca">
            <img class="marca-logo" src="{% static 'gestion/img/logo.png' %}?v=2" alt="Inventaria">
            <h1>Crear cuenta</h1>
            <p>Registra tu PYME en Inventaria</p>
        </div>

        <div class="adorno"><span></span></div>

        {% if mensaje_error %}
            <div class="mensaje-error">{{ mensaje_error }}</div>
        {% endif %}

        <form action="{% url 'registro' %}" method="POST" class="formulario">
            {% csrf_token %}
            <label for="nombre_pyme">Nombre de la PYME</label>
            <input type="text" id="nombre_pyme" name="nombre_pyme" placeholder="Ej. Almacén Don Pepe" value="{{ nombre_pyme }}" required>

            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.cl" value="{{ correo }}" autocomplete="username" required>

            <label for="contrasena">Contraseña</label>
            <input type="password" id="contrasena" name="contrasena" placeholder="Crea una contraseña" autocomplete="new-password" required>

            <button type="submit" class="btn">Registrar datos</button>
        </form>

        <div class="pie-auth">
            <a href="{% url 'inicio' %}" class="btn btn-borde">Volver al inicio</a>
        </div>
    </div>
</main>
{% endblock %}
