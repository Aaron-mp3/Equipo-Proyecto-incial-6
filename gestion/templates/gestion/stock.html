<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventaria - Listado de Stock</title>
    <style>
        body {
            background-color: #8ce6e6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .contenedor-escritorio {
            background-color: white;
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            width: 80%;
            max-width: 900px;
        }
        h2 {
            color: #333;
            margin: 0;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 1.2rem;
        }
        th {
            background-color: #f6c09d;
            padding: 15px;
            color: #333;
            font-weight: bold;
        }
        td {
            padding: 15px;
            border-bottom: 2px solid #ddd;
        }
        tr:hover {
            background-color: #f9f9f9;
        }
        .btn-oval {
            background-color: #ccc;
            color: #333;
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .btn-oval:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="contenedor-escritorio">
        <h2>Listado General de Stock</h2>

        <table>
            <tr>
                <th style="border-top-left-radius: 10px; border-bottom-left-radius: 10px;">Producto</th>
                <th>Cantidad</th>
                <th>Precio Compra</th>
                <th style="border-top-right-radius: 10px; border-bottom-right-radius: 10px;">Precio de Venta</th>
            </tr>
            {% for producto in resultados %}
            <tr>
                <td style="font-weight: bold; text-align: left; padding-left: 30px;">{{ producto.nombre }}</td>
                <td>{{ producto.stock }} unds.</td>
                <td>${{ producto.precio }}</td>
                <td style="font-weight: bold; color: #27ae60;">${{ producto.precio_salida }}</td>
            </tr>
            {% endfor %}
        </table>

        <div style="display: flex; gap: 20px; margin-top: 10px;">
            <a href="{% url 'dashboard' %}" class="btn-oval">Volver al Dashboard</a>
        </div>
    </div>
</body>
</html>
